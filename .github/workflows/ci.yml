name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Web console
        working-directory: web/ui
        run: |
          npm ci
          npx ng lint
          npm run build
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
