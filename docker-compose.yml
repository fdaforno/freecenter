# Build and run Hostwarden:
#   HOSTWARDEN_ADMIN_PASSWORD='choose-a-password' docker compose up -d --build
services:
  hostwarden:
    build: .
    image: hostwarden:latest
    container_name: hostwarden
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOSTWARDEN_ADMIN_USER: admin
      # Password of the administrator created on first start.
      HOSTWARDEN_ADMIN_PASSWORD: ${HOSTWARDEN_ADMIN_PASSWORD:?set HOSTWARDEN_ADMIN_PASSWORD}
    volumes:
      - hostwarden-data:/data

volumes:
  hostwarden-data:
